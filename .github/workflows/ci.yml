name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting with Ruff
        run: |
          ruff check src tests examples

      - name: Check formatting with Black
        run: |
          black --check src tests examples

      - name: Run type checking with MyPy
        run: |
          mypy src

      - name: Run tests with pytest
        run: |
          pytest --cov=frameshift --cov-report=xml --cov-report=term-missing

      # The examples are documentation, and documentation that does not run
      # is documentation that is wrong. Each is written to work without a
      # cluster, so CI can execute them.
      - name: Run examples
        run: |
          for example in examples/*.py; do
            case "$example" in */__init__.py) continue;; esac
            echo "--- $example"
            python "$example" > /dev/null
          done

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
